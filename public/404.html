<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | A&amp;H Devlo</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0C0D0E;
        color: #F4F2ED;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: #141618;
        border: 1px solid #22252A;
        border-radius: 12px;
        padding: 48px 32px;
      }
      .tag {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #8E9298;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 12px;
        color: #F4F2ED;
      }
      p {
        font-size: 14px;
        color: #8E9298;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background-color: #F4F2ED;
        color: #0C0D0E;
        font-weight: 600;
        font-size: 13px;
        padding: 10px 24px;
        border-radius: 9999px;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      a:hover {
        background-color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">404 Error</div>
      <h1>Page not found.</h1>
      <p>The page you are looking for has been moved or does not exist. Return to the main studio portfolio to explore our work.</p>
      <a href="/">Return to Homepage</a>
    </div>
  </body>
</html>
