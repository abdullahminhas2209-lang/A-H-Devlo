<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | A&amp;H Devlo</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #030B14;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background-color: #081726;
        border: 1px solid #163554;
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .tag {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #22D3EE;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      p {
        font-size: 15px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background-color: #22D3EE;
        color: #020617;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        transition: transform 0.2s, background-color 0.2s;
      }
      a:hover {
        background-color: #67E8F9;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">404 ERROR</div>
      <h1>Page Not Found</h1>
      <p>The page or resource you requested does not exist or may have been moved.</p>
      <a href="/">Return to Studio Overview</a>
    </div>
  </body>
</html>
