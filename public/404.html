<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | A&amp;H Devlo</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #030B14;
        color: #F8FAFC;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: #081726;
        border: 1px solid #163554;
        border-radius: 16px;
        padding: 48px 32px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(6, 182, 212, 0.15);
      }
      .tag {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #22D3EE;
        margin-bottom: 16px;
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      p {
        font-size: 14px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background: linear-gradient(135deg, #22D3EE, #06B6D4);
        color: #020617;
        font-weight: 700;
        font-size: 13px;
        padding: 10px 24px;
        border-radius: 9999px;
        text-decoration: none;
        box-shadow: 0 0 16px rgba(6, 182, 212, 0.35);
        transition: all 0.2s ease;
      }
      a:hover {
        background: linear-gradient(135deg, #67E8F9, #22D3EE);
        box-shadow: 0 0 24px rgba(6, 182, 212, 0.55);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">404 Error</div>
      <h1>Page not found.</h1>
      <p>The page you are looking for has been moved or does not exist. Return to the main studio portfolio to explore our work.</p>
      <a href="/">Return to Homepage</a>
    </div>
  </body>
</html>
